name: Cube design system
on:
  push:
    branches: [feat/cube-design-system]
  pull_request:
permissions:
  contents: read
concurrency:
  group: cube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build:package
      - run: npm run test:exports
      - run: npm run build:storybook
      - run: npm run test:catalog
      - run: npm run build:docs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cube-verification
          path: |
            package-lock.json
            dist/build-report.json
            test-results/
            playwright-report/
            design/figma-layers/Studio/01/Actions.png
            design/figma-layers/Studio/02/Inputs.png
            design/figma-layers/Studio/03/Color & style.png
          retention-days: 7
