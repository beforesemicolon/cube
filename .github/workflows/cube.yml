name: Cube design system
on:
  push:
    branches: [main, feat/cube-design-system, feat/media-charts-design-system]
  pull_request:
permissions:
  contents: read
concurrency:
  group: cube-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:release
      - uses: actions/upload-artifact@v4
        if: always()
        # Artifact storage quotas are independent of release verification.
        continue-on-error: true
        with:
          name: cube-verification
          path: |
            package-lock.json
            dist/build-report.json
            test-results/
            playwright-report/
            release-artifacts/
          retention-days: 7
